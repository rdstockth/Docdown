<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: two-column workbench. Left = drop zone, options, file queue. Right = editable Markdown output with preview tab. */
:root {
  --bg: #E9EDF1;
  --surface: #FFFFFF;
  --surface-2: #F3F6F8;
  --ink: #12202B;
  --muted: #55667A;
  --line: #D3DBE2;
  --accent: #0A7C6E;
  --accent-ink: #FFFFFF;
  --accent-soft: #D9F0EC;
  --warn: #9A4A06;
  --bad: #B42318;
  --font-ui: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "IBM Plex Sans Thai", "Noto Sans Thai", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-mark: "Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1418; --surface: #151D23; --surface-2: #1B252C; --ink: #E6EDF2; --muted: #93A4B1;
    --line: #27343D; --accent: #3FCDB4; --accent-ink: #06201B; --accent-soft: #123B35;
    --warn: #F0B35A; --bad: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1418; --surface: #151D23; --surface-2: #1B252C; --ink: #E6EDF2; --muted: #93A4B1;
  --line: #27343D; --accent: #3FCDB4; --accent-ink: #06201B; --accent-soft: #123B35;
  --warn: #F0B35A; --bad: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.7 var(--font-ui); padding-inline: 16px; padding-block: 24px 40px; margin: 0; }
.wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.mark { font: 700 28px/1.2 var(--font-mark); letter-spacing: -0.02em; margin: 0; }
.mark span { color: var(--accent); }
.tag { color: var(--muted); margin: 0; font-size: 14px; }
.bench { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .bench { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.drop { display: grid; gap: 6px; justify-items: start; padding: 22px 18px; border: 2px dashed var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; position: relative; }
.drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { font-size: 16px; font-weight: 600; }
.drop small { color: var(--muted); font-size: 13px; line-height: 1.5; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.btn { font: 500 14px/1.2 var(--font-ui); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn:focus-visible, .item:focus-visible, .tab:focus-visible, textarea:focus-visible, .inp:focus-visible, .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[hidden] { display: none; }
.opts { padding: 14px 16px; display: grid; gap: 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 0; min-width: 0; }
.opts legend { font: 600 12px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 6px; margin-left: -6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.55; }
.opt input { margin-top: 5px; accent-color: var(--accent); }
.opt small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.range { display: grid; gap: 4px; font-size: 14px; }
.range small { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.inp { font: 400 14px var(--font-mono); padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface-2); color: var(--ink); width: 100%; }
.queue-h { display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
.queue-h h2 { font: 600 12px var(--font-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.link { background: none; border: 0; color: var(--muted); font: 400 13px var(--font-ui); cursor: pointer; text-decoration: underline; padding: 2px; }
.link:hover { color: var(--ink); }
.link[hidden] { display: none; }
.list { display: grid; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
.row { display: flex; gap: 6px; align-items: stretch; }
.item { flex: 1; min-width: 0; text-align: left; display: grid; gap: 2px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; line-height: 1.5; color: inherit; }
.item[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.item .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .meta { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 12.5px; color: var(--muted); }
.badge { font: 500 11px var(--font-mono); text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.st-done { color: var(--accent); } .st-error { color: var(--bad); } .st-working { color: var(--warn); }
.x { width: 34px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 16px; }
.x:hover { color: var(--bad); border-color: var(--bad); }
.out { display: grid; grid-template-rows: auto 1fr auto; min-height: 560px; overflow: hidden; }
.out-h { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.fname { display: flex; align-items: center; gap: 8px; min-width: 0; font: 500 14px var(--font-mono); }
.fname span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font: 500 12px var(--font-ui); background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip[hidden] { display: none; }
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--surface-2); border-radius: 8px; }
.tab { border: 0; background: none; font: 500 13px var(--font-ui); color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.body { position: relative; min-height: 0; display: grid; }
textarea { width: 100%; height: 100%; min-height: 440px; resize: none; border: 0; background: var(--surface); color: var(--ink); font: 400 13.5px/1.85 var(--font-mono); padding: 16px; tab-size: 2; }
textarea[hidden], .preview[hidden] { display: none; }
.preview { overflow: auto; padding: 18px 22px; max-height: 640px; line-height: 1.85; }
.preview h1, .preview h2, .preview h3, .preview h4 { line-height: 1.45; margin: 1.2em 0 .4em; text-wrap: balance; }
.preview h1 { font-size: 1.6em; } .preview h2 { font-size: 1.35em; } .preview h3 { font-size: 1.15em; }
.preview p, .preview ul, .preview ol { margin: .6em 0; max-width: 72ch; }
.preview table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
.preview th, .preview td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
.preview th { background: var(--surface-2); }
.preview hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
.preview code { font-family: var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.cut { color: var(--warn); font-size: 13px; border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 10px; }
.state { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; padding: 24px; background: var(--surface); color: var(--muted); }
.state[hidden] { display: none; }
.state b { color: var(--ink); font-weight: 600; }
.bar { width: min(280px, 70vw); height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .15s; }
.out-f { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 9px 14px; border-top: 1px solid var(--line); font: 400 12.5px var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.note { color: var(--warn); font-size: 13px; line-height: 1.55; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--surface-2); }
.note[hidden] { display: none; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: calc(100vw - 32px); z-index: 10; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="mark">Doc<span>down</span></h1>
    <p class="tag">แปลง PDF, Word (.docx) และ Excel (.xlsx .xls .csv) เป็น Markdown ไฟล์ประมวลผลในเบราว์เซอร์ของคุณ ไม่ถูกอัปโหลดไปที่ใด</p>
  </header>

  <div class="bench">
    <div class="col">
      <label class="drop" id="drop" for="file">
        <strong>ลากไฟล์มาวาง หรือคลิกเพื่อเลือก</strong>
        <small>รองรับ .pdf .docx .xlsx .xls .csv เลือกได้หลายไฟล์พร้อมกัน PDF หลักพันหน้าก็ไหว</small>
        <span class="btn primary" aria-hidden="true">เลือกไฟล์</span>
        <input id="file" type="file" accept=".pdf,.docx,.xlsx,.xlsm,.xls,.csv,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" multiple>
      </label>

      <fieldset class="opts">
        <legend>ตัวเลือก PDF</legend>
        <label class="range" for="o-range">ช่วงหน้าที่ต้องการ
          <input class="inp" id="o-range" type="text" inputmode="text" placeholder="ทั้งหมด หรือ 1-50, 80, 120-200" autocomplete="off">
          <small>เหมาะกับไฟล์ใหญ่ ลองแปลงบางช่วงก่อนได้ กด Enter เพื่อใช้ค่า</small>
        </label>
        <label class="opt"><input type="checkbox" id="o-head" checked><span>ตรวจหัวข้อ<small>ดูจากขนาดตัวอักษรที่ใหญ่กว่าเนื้อหา</small></span></label>
        <label class="opt"><input type="checkbox" id="o-hf" checked><span>ตัดหัวกระดาษ/ท้ายกระดาษที่ซ้ำ<small>เช่น เลขหน้า ชื่อบริษัทที่ขึ้นทุกหน้า</small></span></label>
        <label class="opt"><input type="checkbox" id="o-pg"><span>ขีดคั่นระหว่างหน้า<small>แทรก --- ที่รอยต่อของแต่ละหน้า</small></span></label>
        <label class="opt"><input type="checkbox" id="o-pos"><span>เรียงข้อความตามตำแหน่งบนหน้า<small>เปิดเมื่อข้อความที่ได้สลับลำดับ เช่น ไฟล์ที่ลำดับในโครงสร้างไม่ตรงกับที่ตาเห็น</small></span></label>
      </fieldset>

      <fieldset class="opts">
        <legend>ตัวเลือก Excel / CSV</legend>
        <label class="opt"><input type="checkbox" id="o-hid" checked><span>ข้ามชีตที่ซ่อนอยู่<small>แต่ละชีตจะกลายเป็นหัวข้อ ## และตาราง แถวแรกเป็นหัวตาราง ค่าที่แสดงตามรูปแบบในไฟล์ เช่น วันที่ ทศนิยม</small></span></label>
      </fieldset>

      <div>
        <div class="queue-h"><h2>รายการไฟล์</h2><button class="link" id="clear" type="button">ล้างทั้งหมด</button></div>
        <ul class="list" id="list"></ul>
      </div>
    </div>

    <section class="card out" aria-label="ผลลัพธ์ Markdown">
      <div class="out-h">
        <div class="fname"><span id="fname">-</span><span class="chip" id="chip" hidden>ตัวอย่าง</span></div>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="t-md" aria-selected="true" type="button">Markdown</button>
          <button class="tab" role="tab" id="t-pv" aria-selected="false" type="button">ตัวอย่างผลลัพธ์</button>
        </div>
        <div class="acts">
          <button class="btn" id="copy" type="button">คัดลอก</button>
          <button class="btn primary" id="save" type="button">บันทึกเป็น .md</button>
        </div>
      </div>
      <div class="body">
        <textarea id="ta" spellcheck="false" lang="th" aria-label="ข้อความ Markdown แก้ไขได้"></textarea>
        <div class="preview" id="pv" lang="th" hidden></div>
        <div class="state" id="state" hidden></div>
      </div>
      <div>
        <div class="note" id="note" hidden></div>
        <div class="out-f"><span id="s-ch">0 ตัวอักษร</span><span id="s-ln">0 บรรทัด</span><span id="s-hd">0 หัวข้อ</span><span id="s-tb">0 ตาราง</span></div>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turndown/7.1.2/turndown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
/*PURE_START*/
var THAI = /[฀-๿]/;
var THMARK = /^[ัิ-ฺ็-๎]+$/;
var PUA = { 0xF700: 'ฐ', 0xF701: 'ิ', 0xF702: 'ี', 0xF703: 'ึ', 0xF704: 'ื', 0xF705: '่', 0xF706: '้', 0xF707: '๊', 0xF708: '๋', 0xF709: '์', 0xF70A: '่', 0xF70B: '้', 0xF70C: '๊', 0xF70D: '๋', 0xF70E: '์', 0xF70F: 'ญ', 0xF710: 'ั', 0xF711: 'ํ', 0xF712: '็', 0xF713: '่', 0xF714: '้', 0xF715: '๊', 0xF716: '๋', 0xF717: '์', 0xF718: 'ุ', 0xF719: 'ู', 0xF71A: 'ฺ' };

/* แก้ปัญหาตัวอักษรไทยจาก PDF: ฟอนต์เก่า (PUA), สระอำแยกชิ้น, วรรณยุกต์ซ้ำ, เ+เ */
function thaiFix(s) {
  if (!THAI.test(s) && !/[-​]/.test(s)) return s;
  s = s.replace(/[-]/g, function (c) { return PUA[c.charCodeAt(0)] || ''; });
  s = s.replace(/[​﻿]/g, '');
  s = s.replace(/ํ([่-๋])?า/g, function (m, t) { return (t || '') + 'ำ'; });
  s = s.replace(/([่-๋])ํา/g, '$1ำ');
  s = s.replace(/([ัิ-ฺ็-๎])\1+/g, '$1');
  s = s.replace(/เเ/g, 'แ');
  return s;
}

function parseRange(str, n) {
  str = (str || '').replace(/[๐-๙]/g, function (c) { return String(c.charCodeAt(0) - 0x0E50); }).trim();
  var all = [], i;
  if (!str || /^(all|ทั้งหมด)$/i.test(str)) { for (i = 1; i <= n; i++) all.push(i); return all; }
  var seen = {};
  str.split(/[,\s;]+/).forEach(function (part) {
    var m = /^(\d+)(?:\s*[-–]\s*(\d+))?$/.exec(part);
    if (!m) return;
    var a = parseInt(m[1], 10), b = m[2] ? parseInt(m[2], 10) : a;
    if (a > b) { var t = a; a = b; b = t; }
    for (var k = Math.max(1, a); k <= Math.min(n, b); k++) seen[k] = 1;
  });
  return Object.keys(seen).map(Number).sort(function (x, y) { return x - y; });
}

/* items จาก pdf.js -> บรรทัดข้อความ */
function buildLines(raw, byPos) {
  var its = [], prev = null;
  raw.forEach(function (it) {
    if (typeof it.str !== 'string' || !it.str.length) return;
    var s = thaiFix(it.str);
    if (!s.length) return;
    var tr = it.transform;
    if (THMARK.test(s) && prev) { prev.s += s; return; }   /* วรรณยุกต์/สระลอย ต่อท้ายตัวก่อนหน้าเสมอ */
    prev = { s: s, x: tr[4], y: tr[5], w: it.width || 0, size: Math.hypot(tr[0], tr[1]) || it.height || 10 };
    its.push(prev);
  });
  if (byPos) its.sort(function (a, b) { return (b.y - a.y) || (a.x - b.x); });
  var lines = [], line = null;
  its.forEach(function (it) {
    if (!line || Math.abs(line.y - it.y) > Math.max(line.size, it.size) * 0.6) {
      line = { y: it.y, size: it.size, parts: [] }; lines.push(line);
    }
    line.parts.push(it);
  });
  var out = [];
  lines.forEach(function (l) {
    if (byPos) l.parts.sort(function (a, b) { return a.x - b.x; });
    var text = '', last = null, weight = {}, x1 = Infinity, x2 = -Infinity;
    l.parts.forEach(function (p) {
      if (last) {
        var gap = p.x - (last.x + last.w);
        var both = THAI.test(text.charAt(text.length - 1)) && THAI.test(p.s.charAt(0));
        var th = both ? p.size * 0.33 : p.size * 0.18;
        if (gap > th && !/\s$/.test(text) && !/^\s/.test(p.s)) text += ' ';
      }
      text += p.s; last = p;
      var k = Math.round(p.size * 2) / 2; weight[k] = (weight[k] || 0) + p.s.length;
      if (p.x < x1) x1 = p.x;
      if (p.x + p.w > x2) x2 = p.x + p.w;
    });
    text = text.replace(/\s+/g, ' ').trim();
    if (!text) return;
    var best = l.size, bw = -1;
    Object.keys(weight).forEach(function (k) { if (weight[k] > bw) { bw = weight[k]; best = parseFloat(k); } });
    out.push({ text: text, x: x1, x2: x2, y: l.y, size: best });
  });
  return out;
}

/* ชุดบรรทัดต่อหน้า -> Markdown ทั้งเล่ม  pd = [{n, lines}] */
function assemble(pd, o) {
  var total = 0, hist = {}, i;
  pd.forEach(function (p) { p.lines.forEach(function (l) { total += l.text.length; var k = Math.round(l.size * 2) / 2; hist[k] = (hist[k] || 0) + l.text.length; }); });
  if (total < 20) return { md: '', warn: 'ไม่พบข้อความในหน้าที่เลือก อาจเป็น PDF ที่สแกนมาเป็นรูปภาพ ซึ่งต้องใช้ OCR' };
  var body = 11, bw = -1;
  Object.keys(hist).forEach(function (k) { if (hist[k] > bw) { bw = hist[k]; body = parseFloat(k); } });

  var drop = null;
  if (o.hf && pd.length >= 3) {
    var cnt = {};
    pd.forEach(function (p) {
      var seen = {}, ls = p.lines;
      ls.forEach(function (l, j) {
        if (j < 2 || j >= ls.length - 2) { var k = l.text.replace(/[0-9๐-๙]+/g, '#'); if (!seen[k]) { seen[k] = 1; cnt[k] = (cnt[k] || 0) + 1; } }
      });
    });

  $('#file').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
  var drop = $('#drop');
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && !drop.contains(e.target)) addFiles(e.dataTransfer.files); });

  $('#clear').addEventListener('click', function () { items.forEach(function (i) { i.cancel = true; }); items = []; sel = null; render(); });
  $('#ta').addEventListener('input', function () {
    var it = cur(); if (!it) return; var v = this.value;
    it.md = v; this.dataset.id = it.id + ':' + v.length;
    clearTimeout(statT); statT = setTimeout(function () { stats(v); }, 250);
  });

  function setTab(t) {
    tab = t;
    $('#t-md').setAttribute('aria-selected', t === 'md'); $('#t-pv').setAttribute('aria-selected', t === 'pv');
    renderOut();
  }
  $('#t-md').addEventListener('click', function () { setTab('md'); });
  $('#t-pv').addEventListener('click', function () { setTab('pv'); });

  $('#copy').addEventListener('click', function () {
    var it = cur(); if (!it) return;
    var fallback = function () { var ta = $('#ta'); setTab('md'); ta.focus(); ta.select(); try { document.execCommand('copy'); toast('คัดลอกแล้ว'); } catch (e) { toast('เลือกข้อความแล้ว กด Ctrl+C เพื่อคัดลอก'); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(it.md).then(function () { toast('คัดลอกแล้ว'); }, fallback);
    else fallback();
  });
  $('#save').addEventListener('click', function () {
    var it = cur(); if (!it) return;
    var blob = new Blob(['﻿' === '' ? '' : it.md], { type: 'text/markdown;charset=utf-8' });
    if (dl) {
      dl.save({ filename: mdName(it.name), data: blob }).then(
        function () { toast('บันทึกแล้ว'); },
        function (e) { if (e && e.code !== 'declined') toast('บันทึกไม่สำเร็จ ใช้ปุ่มคัดลอกแทนได้'); }
      );
      return;
    }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = mdName(it.name);
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500); toast('บันทึกแล้ว');
  });

  function reconvertPdfs() {
    items.forEach(function (it) { if (!it.example && it.type !== 'docx' && it.status !== 'queue') { if (it.status === 'working') return; enqueue(it); } });
  }
  ['#o-head', '#o-hf', '#o-pg', '#o-pos', '#o-hid'].forEach(function (id) { $(id).addEventListener('change', reconvertPdfs); });
  $('#o-range').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); reconvertPdfs(); } });
  $('#o-range').addEventListener('change', reconvertPdfs);

  /* ---------- boot ---------- */
  items.push({ id: nextId++, name: 'รายงานตัวอย่าง.docx', size: 0, type: 'docx', status: 'done', md: SAMPLE, warn: '', example: true });
  sel = items[0].id;
  if (inViewer) $('#save').hidden = true;
  render();
  try {
    if (inViewer) window.claude.use('downloads').then(function (d) { if (d) { dl = d; $('#save').hidden = false; } }, function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
